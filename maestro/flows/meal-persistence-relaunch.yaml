# TC-E2E-05 / REQ-P0-04 — persistance repas après stopApp + relaunch (sans clearState)
appId: com.geraldy.macrozone
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "welcome-guest-btn"  # DEF-HIST-06: welcome title is one Text ("Welcome to nutriFlow"), old regex never full-matched
    timeout: 20000
- runFlow:
    when:
      visible: "Continuer en tant qu'invité|Continue as guest|Continuar como invitado"
    commands:
      - tapOn:
          id: "welcome-guest-btn"
- extendedWaitUntil:
    visible: "nutriFlow|Today|Aujourd|Hoy"
    timeout: 20000
- tapOn:
    id: "add-meals-tab"
- tapOn:
    id: "meal-name-input"
- eraseText
- inputText: "PersistMealP0"
- tapOn:
    id: "meal-calories-input"
- eraseText
- inputText: "321"
- hideKeyboard
- tapOn:
    id: "add-meal-submit"
- extendedWaitUntil:
    visible: "(Meal added successfully|Repas ajouté avec succès|¡?Comida añadida con éxito)\\s*!?"  # DEF-HIST-05
    timeout: 8000
- tapOn:
    id: "all-meals-tab"
- assertVisible: "PersistMealP0"
- stopApp
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      visible: "Continuer en tant qu'invité|Continue as guest|Continuar como invitado"
    commands:
      - tapOn:
          id: "welcome-guest-btn"
- extendedWaitUntil:
    visible: "nutriFlow|Today|Aujourd|Hoy|PersistMealP0|Meals|Repas|Comidas"
    timeout: 30000
# History bottom tab is always present on tab screens (no longer a Journal-only chip)
- extendedWaitUntil:
    visible:
      id: "all-meals-tab"
    timeout: 20000
- tapOn:
    id: "all-meals-tab"
- extendedWaitUntil:
    visible: "PersistMealP0"
    timeout: 20000
- assertVisible: "PersistMealP0"
