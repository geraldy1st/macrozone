# Community tab smoke (guest can open feed)
appId: com.geraldy.macrozone
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "welcome-guest-btn"
    timeout: 60000
- tapOn:
    id: "welcome-guest-btn"
- extendedWaitUntil:
    visible:
      id: "community-tab"
    timeout: 30000
- tapOn:
    id: "community-tab"
- extendedWaitUntil:
    visible:
      id: "community-tab"
    timeout: 15000
# Title testID may be missing on older APKs — assert tab + guest banner text as fallback
- extendedWaitUntil:
    visible: "Community|Communauté|Comunidad|Meals shared|Repas partagés|Comidas compartidas"
    timeout: 20000
