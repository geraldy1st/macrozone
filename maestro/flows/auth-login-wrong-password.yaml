# Auth: wrong password shows an error
# Requires EMAIL (any) + WRONG_PASSWORD from generate-test-user.cjs
appId: com.geraldy.macrozone
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Bienvenue|Welcome|nutriFlow|Bienvenido"
    timeout: 20000
- tapOn:
    id: "welcome-sign-in-btn"
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 15000
- tapOn:
    id: "auth-email-input"
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: "auth-password-input"
- eraseText
- inputText: ${WRONG_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-submit-btn"
- extendedWaitUntil:
    visible: "incorrect|Incorrect|incorrectos|Authentication error|Erreur d'authentification|Error de autenticación|sign-in|connexion"
    timeout: 15000
