# TC-E2E-01 / REQ-P0-01 + REQ-P0-03 — ajout manuel + macros accueil
appId: com.geraldy.macrozone
---
- launchApp
- extendedWaitUntil:
    visible: "Bienvenue|Welcome|nutriFlow"
    timeout: 20000
- runFlow:
    when:
      visible: "Continuer en tant qu'invité|Continue as guest"
    commands:
      - tapOn:
          id: "welcome-guest-btn"
- extendedWaitUntil:
    visible: "nutriFlow|Today|Aujourd|Hoy"
    timeout: 20000
- tapOn:
    id: "home-tab"
- tapOn:
    id: "add-meals-tab"
- tapOn:
    id: "meal-name-input"
- eraseText
- inputText: "Salade Cesar"
- tapOn:
    id: "meal-calories-input"
- eraseText
- inputText: "450"
- hideKeyboard
- tapOn:
    id: "add-meal-submit"
- extendedWaitUntil:
    visible: "Meal added successfully|Repas ajouté avec succès"
    timeout: 8000
- tapOn:
    id: "home-tab"
- extendedWaitUntil:
    visible:
      id: "macro-grid"
    timeout: 10000
- assertVisible:
    id: "macro-grid"
# Calories from the meal (hero value) — text or dedicated testID
- assertVisible: "450"
# History tab (bottom bar, between Journal and Add) must be visible on Journal
- assertVisible:
    id: "all-meals-tab"
- tapOn:
    id: "all-meals-tab"
- assertVisible: "Tous les repas|All Meals|Todas las comidas"
- assertVisible: "Salade Cesar"
