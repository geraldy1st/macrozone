# CI helper (APK pass, case e) — Journal, scroll until the « Historique » chip is visible.
appId: com.geraldy.macrozone
---
- tapOn:
    id: "home-tab"
- scrollUntilVisible:
    element:
      id: "journal-history-btn"
    direction: DOWN
    timeout: 15000
    centerElement: true
- waitForAnimationToEnd:
    timeout: 3000
